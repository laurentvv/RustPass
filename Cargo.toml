[package]
name = "rustpass"
version = "0.1.0"
edition = "2024"
authors = ["Laurent VOLFF"]
description = "Clean-room high-security KDBX 3.1/4.0 password manager in pure Rust (GUI, CLI & Browser Proxy)"
license = "MIT"
readme = "README.md"
keywords = ["keepass", "keepassxc", "kdbx", "password-manager", "egui"]
categories = ["cryptography", "gui", "command-line-utilities"]
default-run = "rustpass"

[[bin]]
name = "rustpass"
path = "src/main.rs"

[[bin]]
name = "rustpass-cli"
path = "src/bin/rustpass-cli.rs"

[[bin]]
name = "rustpass-proxy"
path = "src/bin/rustpass-proxy.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
arboard = "3.7.0"
argon2 = "0.6.0"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "block-padding", "zeroize"] }
chacha20 = { version = "0.10.2", features = ["cipher", "zeroize"] }
chrono = { version = "0.4.45", features = ["serde"] }
cipher = { version = "0.5.2", features = ["alloc", "block-padding", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
flate2 = "1.1.10"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
open = "5.4.4"
regex = "1.12.3"
rfd = "0.17.2"
roxmltree = "0.21.2"
rpassword = "7.5.4"
salsa20 = { version = "0.11.0", features = ["zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
